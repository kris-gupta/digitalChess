; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
build_type = debug

upload_port = /dev/ttyACM2
monitor_port = /dev/ttyACM2

monitor_speed = 115200
monitor_raw = yes

board_upload.flash_size = 4MB
board_build.flash_size = 4MB

; Same firmware, but scanb() plays back a scripted opening (one move every
; 5s) instead of reading the physical sensor matrix — for watching a live
; broadcast on lichess.org without the sensor board wired up. See
; DEMO_MODE in src/board.c.
[env:demo]
extends = env:esp32dev
build_flags = -DDEMO_MODE

; Same firmware, but scanb() blocks on a line typed into the serial console
; (UCI format, e.g. "e2e4") instead of reading the physical sensor matrix —
; for playing individual moves by hand and watching them land on the
; broadcast. See MANUAL_MODE in src/board.c.
[env:manual]
extends = env:esp32dev
build_flags = -DMANUAL_MODE
