; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
build_type = debug

upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1

monitor_speed = 115200
monitor_raw = yes

board_upload.flash_size = 4MB
board_build.flash_size = 4MB

; Same firmware, built to join Wokwi's open virtual internet gateway
; (SSID "Wokwi-GUEST") instead of your real WiFi network, so the simulator
; can actually reach Lichess. See src/wifi.c's WOKWI_SIMULATION branch.
[env:wokwi]
extends = env:esp32dev
build_flags = -DWOKWI_SIMULATION
